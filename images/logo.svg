    <ellipse cx="50" cy="50" rx="36" ry="12" fill="none" stroke="#f1faee" stroke-width="4" transform="rotate(-25 50 50)" stroke-linecap="round"/>
    
    <!-- Central Planetary Body Sphere -->
    <circle cx="50" cy="50" r="20" fill="#1d3557" stroke="#f1faee" stroke-width="4"/>
    
    <!-- Surface Contours -->
    <path d="M42 45 C 46 43, 48 47, 54 44" fill="none" stroke="#f1faee" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38 55 C 44 57, 46 52, 52 56" fill="none" stroke="#f1faee" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Orbiting Satellite and Stellar Elements -->
    <circle cx="78" cy="32" r="3" fill="#f1faee"/>
    <polygon points="25,25 27,21 31,19 27,17 25,13 23,17 19,19 23,21" fill="#f1faee"/>
    <circle cx="72" cy="72" r="1.5" fill="#f1faee"/>
