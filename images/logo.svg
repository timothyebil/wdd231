<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Definitions for Gradients and Filters -->
    <defs>
        <!-- Orbit Path Core Glow Gradient -->
        <linearGradient id="skywayGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d2ff"/>
            <stop offset="100%" stop-color="#0066ff"/>
        </linearGradient>
        
        <!-- Central Sphere Tech Metallic Shading -->
        <radialGradient id="sphereShade" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="40%" stop-color="#e0ebf5"/>
            <stop offset="100%" stop-color="#1a3a5f"/>
        </radialGradient>

        <!-- Drop Shadow Filter for Depth Realism -->
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#001533" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Background Space Anchor (Optional Transparent Canvas Boundary) -->
    <rect width="100%" height="100%" fill="none"/>

    <!-- Integrated Structural Group Layout -->
    <g transform="translate(0, 0)" filter="url(#softShadow)">
        <!-- Outer Elliptical Orbit Track Frame -->
        <ellipse cx="50" cy="50" rx="42" ry="18" 
                 fill="none" 
                 stroke="url(#skywayGlow)" 
                 stroke-width="5.5" 
                 stroke-linecap="round"
                 transform="rotate(-28, 50, 50)"/>

        <!-- Foreground Dynamic Propulsion Arc Layer -->
        <path d="M 22,28 A 42,18 0 0,1 82,42" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="2" 
              stroke-dasharray="4 3"
              transform="rotate(-28, 50, 50)"/>

        <!-- Primary Focal Sphere (The Core Planet Hub Node) -->
        <circle cx="50" cy="50" r="22" fill="url(#sphereShade)"/>

        <!-- Inner Dynamic Tech Crest Lines -->
        <path d="M 36,44 Q 50,34 64,44 Q 50,66 36,44 Z" 
              fill="none" 
              stroke="#00d2ff" 
              stroke-width="1.5" 
              stroke-opacity="0.6"/>

        <!-- Orbiting Satellite Node (The SykWay Messenger Dot) -->
        <circle cx="78" cy="35" r="5" fill="#00d2ff"/>
        <circle cx="78" cy="35" r="2.5" fill="#ffffff"/>
    </g>
</svg>
