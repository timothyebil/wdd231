<svg xmlns="http://w3.org" viewBox="0 0 120 120" width="100%" height="100%">
    <style>
        .orbit-core { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; }
        .orbit-ring { fill: none; stroke: #457b9d; stroke-width: 2; opacity: 0.85; }
        .orbit-star { fill: #e63946; }
        .brand-text {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            fill: #ffffff;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }
    </style>

    <!-- Grouped Orbital System Elements -->
    <g transform="translate(10, 5)">
        <!-- Planetary Core Arc Lines -->
        <path d="M40 50 A15 15 0 0 1 60 32" class="orbit-core" />
        <path d="M63 35 A15 15 0 0 1 63 65" class="orbit-core" stroke-dasharray="2 2" />
        <path d="M57 67 A15 15 0 0 1 40 50" class="orbit-core" />
        
        <!-- Cross-Cutting Orbital Ring System -->
        <ellipse cx="50" cy="50" rx="32" ry="10" class="orbit-ring" transform="rotate(-30 50 50)" />
        
        <!-- High-Impact Constellation Stars -->
        <polygon points="76,24 78,28 82,28 79,31 80,35 76,33 72,35 73,31 70,28 74,28" class="orbit-star" />
        <circle cx="24" cy="62" r="1.5" fill="#457b9d" />
        <circle cx="32" cy="22" r="1" fill="#ffffff" />
    </g>

    
    <text x="60" y="105" class="brand-text">SykWay Orbit</text>
</svg>
