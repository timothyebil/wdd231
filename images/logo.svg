<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
    <style>
        .logo-bg-core { 
            fill: #e63946; 
            transition: fill 0.3s ease;
        }
        .logo-orbit-ring { 
            fill: none; 
            stroke: #457b9d; 
            stroke-width: 4; 
        }
        .logo-initials-text {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: central;
            user-select: none;
        }
        /* Pulse interaction sequence localized within vector constraints */
        svg:hover .logo-bg-core {
            fill: #1d3557;
        }
    </style>

    <!-- Central Planet Core -->
    <circle cx="50" cy="50" r="22" class="logo-bg-core" />
    
    <!-- Orbital Ring Track Path Layer -->
    <ellipse cx="50" cy="50" rx="42" ry="12" class="logo-orbit-ring" transform="rotate(-25 50 50)" />
    
    <!-- Satellite Intersect Node -->
    <circle cx="84" cy="34" r="6" fill="#1d3557" />

    <!-- Center-Aligned Initials Text Node -->
    <text x="50" y="50" class="logo-initials-text">TE</text>
</svg>
